<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{% block title %}Ties{% endblock %}</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; max-width: 960px; margin: 2rem auto; padding: 0 1rem; color: #222; }
    header { border-bottom: 2px solid #222; padding-bottom: .5rem; margin-bottom: 1.5rem; }
    header a { color: #222; text-decoration: none; margin-right: 1rem; }
    header a:hover { text-decoration: underline; }
    nav.breadcrumbs { font-size: .9rem; color: #666; margin-bottom: 1rem; }
    nav.breadcrumbs a { color: #666; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: .5rem; border-bottom: 1px solid #eee; }
    th { background: #f7f7f7; }
    .tag { display: inline-block; background: #eef; padding: .15rem .5rem; border-radius: 1rem; margin-right: .25rem; font-size: .85rem; }
    .meta { color: #666; font-size: .9rem; }
    form p { margin: .75rem 0; }
    label { display: block; font-weight: 600; margin-bottom: .25rem; }
    input[type="text"], input[type="email"], input[type="url"], input[type="date"], textarea { width: 100%; padding: .5rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    textarea { min-height: 5rem; }
    button { background: #222; color: white; border: 0; padding: .5rem 1rem; border-radius: 4px; cursor: pointer; }
    button:hover { background: #444; }
    .button-link { display: inline-block; background: #222; color: white; padding: .5rem 1rem; border-radius: 4px; text-decoration: none; }
    .button-link:hover { background: #444; }
    .muted { color: #888; }
    .pill { display: inline-block; background: #ddd; padding: .15rem .5rem; border-radius: 1rem; margin-right: .25rem; font-size: .85rem; }
  </style>
</head>
<body>
  <header>
    <strong>Ties</strong> &middot; a personal CRM
    &nbsp;&nbsp;
    <a href="{% url 'crm:person_list' %}">People</a>
    <a href="{% url 'crm:company_list' %}">Companies</a>
    <a href="{% url 'crm:search' %}">Search</a>
    <a href="{% url 'crm:person_create' %}" class="button-link" style="float:right;">+ Add person</a>
  </header>
  {% block content %}{% endblock %}
</body>
</html>
